name: space-cycle

services:
  space-cycle:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-cycle:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SPACE_CYCLE_DB: /app/data/visits.sqlite
      # Server publishes these validated budgets to every visit session.
      SPACE_CYCLE_LOCATION_TIMEOUT_MS: "15000"
      SPACE_CYCLE_MAX_GAP_MS: "25000"
      SPACE_CYCLE_NETWORK_RESERVE_MS: "5000"
    volumes:
      - visits-data:/app/data
    # A host-installed cloudflared can reach this without a public app port.
    ports:
      - "127.0.0.1:4500:4500"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: "1.0"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  visits-data:
