name: space-cycle

services:
  space-cycle:
    build:
      context: .
      dockerfile: Dockerfile
    image: space-cycle:${IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
    # A host-installed cloudflared can reach this without a public app port.
    ports:
      - "127.0.0.1:4500:4500"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 256m
    cpus: "1.0"
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
