<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="icon" href="/images/rounded-favicon_32.png">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <title>로그인 · Space Cycle</title>
</head>
<body class="app-shell">
    <!-- app-header -->
    <main class="page-main">
        <p class="page-eyebrow">WELCOME TO SPACE CYCLE</p>
        <h1 class="page-title">로그인</h1>
        <p class="page-description">Google 계정으로 시작해요.</p>
        <section class="info-panel" aria-label="Google 로그인">
            <p id="auth-status" role="status" aria-live="polite" aria-atomic="true">로그인 상태 확인 중...</p>
            <button class="page-action" id="google-login" type="button" aria-describedby="auth-status" disabled>Google로 계속하기</button>
            <button class="page-action" id="logout" type="button" hidden>로그아웃</button>
            <button class="page-action" id="auth-retry" type="button" hidden>새로고침하고 다시 연결</button>
            <p class="page-note">Google 로그인 창에서 계정을 선택하면 이전 화면으로 돌아가요.</p>
            <p class="page-note">로그인하면 계정 UID로 방문 기록을 저장해요. 처리 항목·보관 기간·국외 이전은 <a class="policy-link" href="/privacy">개인정보 처리방침</a>에서 확인해주세요.</p>
            <noscript><p class="page-note">로그인하려면 브라우저에서 JavaScript를 켠 뒤 새로고침해 주세요.</p></noscript>
        </section>
    </main>
    <!-- app-navigation -->
    <script id="auth-bootstrap">
        (() => {
            const status = document.getElementById('auth-status');
            const login = document.getElementById('google-login');
            const retry = document.getElementById('auth-retry');
            // Classic inline script: also runs when a Firebase CDN import fails.
            const timeout = window.setTimeout(() => {
                if (window.SpaceCycleAuth?.isReady) return;
                login.disabled = true;
                if (!status.dataset.authError) {
                    status.textContent = '로그인 서버에 연결하지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해 주세요.';
                }
                retry.hidden = false;
            }, 10000);
            window.addEventListener('spacecycle:authchange', () => {
                if (!window.SpaceCycleAuth?.isReady) return;
                window.clearTimeout(timeout);
                retry.hidden = true;
            });
            retry.addEventListener('click', () => window.location.reload());
        })();
    </script>
</body>
</html>
