<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/>
    <link rel="icon" type="image/x-icon" href="/images/rounded-favicon_32.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/index.css">
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/auth.js"></script>
    <title>Space Cycle</title>
</head>
<!-- body 시작 -->
<body>
    <!-- 헤더 공간 -->
    <header id="header">
        <div class="logo">
            <p>SPACE CYCLE</p>
        </div>
        <div>
            <a href="/login" id="link-non-color" class="btn" data-auth-link>LOGIN</a>
        </div>
    </header>
    <!-- 메인 공간 -->
    <main class="home-main">
        <div id="main">
            <h1 class="first-main">SPACE CYCLE</h1>
            <p class="second-sub">잠든 공간의 재발견</p>
            <div class="third-btn">
                <a href="/" class="in-first-btn">공간 보기<span class="fv-btn-arrow">→</span></a>
                <a href="/" class="in-second-btn">내 뱃지 보기<span class="fv-btn-arrow">→</span></a>
            </div>
            <p id="user-greeting" hidden aria-live="polite"></p>
            <dl class="space-stats">
                <div class="space-stat">
                    <dt>실내 스페이스</dt>
                    <dd>12+</dd>
                </div>
                <div class="space-stat">
                    <dt>야외 스페이스</dt>
                    <dd>8+</dd>
                </div>
                <div class="space-stat">
                    <dt>내가 찾은 스페이스</dt>
                    <dd id="found-space-count">—</dd>
                </div>
            </dl>
        </div>
    </main>
    <!-- 내비게이션 바 공간 -->
    <nav class="bottom-nav">
        <a href="" id="link-non-color" aria-current="page">Home</a>
        <a href="" id="link-non-color">User</a>
        <label class="theme-switch" title="다크 테마 전환">
            <span>다크 테마</span>
            <input type="checkbox" id="theme-toggle" role="switch" aria-label="다크 테마">
        </label>
    </nav>
</body>
<!-- body 끝 -->
</html>
